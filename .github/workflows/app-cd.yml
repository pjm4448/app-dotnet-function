# ---------------------------------------------------------------------------
# Workflow: Deploy Application
# Triggered on successful CI completion, manual dispatch, or infrastructure dispatch.
# Promotes the immutable deployment package through dev → test → prod.
# ---------------------------------------------------------------------------

name: Deploy Application

on:
  # Automatic: triggered when Application CI completes on main
  workflow_run:
    workflows: ["Application CI"]
    branches: [main]
    types: [completed]

  # Manual: triggered for rollback or redeployment
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID (find in Actions tab → Application CI → run number)'
        required: true
        type: string
      commit_sha:
        description: 'Git commit SHA to deploy and verify'
        required: true
        type: string

  # Cross-repository signal from the infrastructure pipeline
  repository_dispatch:
    types: [infrastructure-updated]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:

  # =========================================================================
  # Resolve: determine the source CI run and commit SHA
  # Handles workflow_run, workflow_dispatch, and repository_dispatch
  # =========================================================================
  resolve:
    name: Resolve Deployment Source
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      artifact-run-id: ${{ steps.set-params.outputs.run-id }}
      commit-sha: ${{ steps.set-params.outputs.sha }}

    steps:
      - name: Determine source parameters
        id: set-params
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run-id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "Source: CI workflow run #${{ github.event.workflow_run.id }}"
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-id=${{ inputs.ci_run_id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
            echo "Source: Manual dispatch (rollback)"
            echo "CI Run: ${{ inputs.ci_run_id }}"
            echo "Commit: ${{ inputs.commit_sha }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            LATEST=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Application CI" \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId,headSha \
              --jq '.[0] // empty')

            if [ -z "$LATEST" ]; then
              echo "::error::No successful Application CI run was found on main; cannot resolve the deployment package"
              exit 1
            fi

            RUN_ID=$(echo "$LATEST" | jq -r '.databaseId // empty')
            SHA=$(echo "$LATEST" | jq -r '.headSha // empty')

            if [ -z "$RUN_ID" ] || [ -z "$SHA" ]; then
              echo "::error::The latest successful Application CI run did not include a run ID and commit SHA"
              exit 1
            fi

            echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Source: repository_dispatch (infrastructure-updated)"
            echo "Resolved CI Run: $RUN_ID"
            echo "Resolved Commit: $SHA"
          else
            echo "::error::Unsupported event type: ${{ github.event_name }}"
            exit 1
          fi

  # =========================================================================
  # Stage 1: Development
  # =========================================================================
  deploy-dev:
    name: Development
    needs: resolve
    uses: ./.github/workflows/reusable-app-deploy.yml
    with:
      environment: development
      artifactRunId: ${{ needs.resolve.outputs.artifact-run-id }}
      commitSha: ${{ needs.resolve.outputs.commit-sha }}

  # =========================================================================
  # Stage 2: Testing
  # =========================================================================
  deploy-test:
    name: Testing
    needs: [resolve, deploy-dev]
    uses: ./.github/workflows/reusable-app-deploy.yml
    with:
      environment: testing
      artifactRunId: ${{ needs.resolve.outputs.artifact-run-id }}
      commitSha: ${{ needs.resolve.outputs.commit-sha }}

  # =========================================================================
  # Stage 3: Production (approval-gated)
  # =========================================================================
  deploy-prod:
    name: Production
    needs: [resolve, deploy-test]
    uses: ./.github/workflows/reusable-app-deploy.yml
    with:
      environment: production
      artifactRunId: ${{ needs.resolve.outputs.artifact-run-id }}
      commitSha: ${{ needs.resolve.outputs.commit-sha }}
